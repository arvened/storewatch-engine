name: Coffee markets (private code and data)

# Daily coffee collection moved here from the private repository arvened/Storewatch:
# minutes of a public repository are free. Code, store lists, reports and the database stay
# private (arvened/Storewatch: branch "data" for reports, branch "db" for the database).
#
# This repository is public, so its logs are public: every store host is masked and ALL program
# output goes to a log file in the private "data" branch (logs/). The public log shows only counts.
#
# Needs DATA_TOKEN with Contents read/write on arvened/Storewatch too (edit the token, no new secret).
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (red alerts for the PL market).
#
# Runs before the private schedule (05:17 UTC): the private run then sees today in usage.csv and
# skips (~1 min). If this run fails, the private run collects as before - nothing is lost.
on:
  schedule:
    - cron: "47 4 * * *"     # 04:47 UTC
    - cron: "17 9 * * *"     # backups: skipped if today is already collected
    - cron: "47 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-markets
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PRIVATE_REPO: arvened/Storewatch
      STOREWATCH_DB: storewatch.db
      STOREWATCH_DELAY: "0.5"
      STOREWATCH_MAX_PAGES: "300"
      STOREWATCH_WORKERS: "6"
      TELEGRAM_MARKETS: "pl"
      WEEKLY_MARKETS: "pl"
      BUDGET_MINUTES: "1000000"   # public minutes are free: never switch to saver/minimal mode
    steps:
      - name: Secrets present?
        id: check
        env:
          T: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATA_TOKEN not set."; fi

      - name: Get private code
        if: steps.check.outputs.ok == 'true'
        id: code
        continue-on-error: true            # token without access to Storewatch yet: private run stays in charge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: app

      - name: Get private reports
        if: steps.code.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          ref: data
          path: app/data

      - name: Already collected today?
        if: steps.code.outcome == 'success'
        id: gate
        run: |
          DAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "^$DAY," app/data/usage.csv 2>/dev/null; then
            echo "already collected today - skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get private database
        if: steps.gate.outputs.run == 'true'
        id: db
        run: |
          cd app
          if git fetch -q --depth 1 origin db 2>/dev/null; then
            git show FETCH_HEAD:storewatch.db.gz | gunzip > storewatch.db
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No branch db in the private repository yet - run StoreWatch there once with db_only. Skipped."
          fi

      - if: steps.db.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect (output stays private)
        if: steps.db.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd app
          set +e        # a store that cannot be read (exit 4) must not stop the other markets
          # Hide every store host from the public log.
          for f in markets/*.txt; do
            while IFS= read -r line; do
              line=${line%%#*}; host=${line%%|*}; host=$(echo "$host" | tr -d '[:space:]')
              host=${host#*://}; host=${host%%/*}; host=${host%%:*}
              [ -n "$host" ] && echo "::add-mask::$host"
            done < "$f"
          done
          DAY=$(date -u +%F)
          mkdir -p data/logs
          LOG="data/logs/$DAY-coffee.log"
          STATUS=0
          {
            echo "== $(date -u +%FT%TZ) coffee markets (public runner)"
            python -m storewatch context --out data/context.json > /dev/null || true
            mkdir -p data/history/context
            [ -f data/context.json ] && cp data/context.json "data/history/context/$DAY.json" || true
            for f in markets/*.txt; do
              m=$(basename "$f" .txt)
              echo "-- $m"
              python -m storewatch sync "$f" --market "$m"
              mkdir -p "data/reports/$m"
              TG=""
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && [[ " $TELEGRAM_MARKETS " == *" $m "* ]]; then
                TG="--telegram"
              fi
              python -m storewatch run --market "$m" --md "data/reports/$m/$DAY.md" \
                --json "data/reports/$m/latest.json" --keep 30 --usage data/usage.csv $TG > /dev/null
              code=$?
              echo "run $m exit $code"
              [ -f "data/reports/$m/$DAY.md" ] && cp "data/reports/$m/$DAY.md" "data/reports/$m/latest.md"
              mkdir -p "data/history/$m"
              if [ -z "$(ls -A "data/history/$m")" ]; then
                python -m storewatch export --market "$m" --all --csv "data/history/$m/backfill-$DAY.csv.gz" > /dev/null || true
              else
                python -m storewatch export --market "$m" --csv "data/history/$m/$DAY.csv.gz" > /dev/null || true
              fi
              if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then STATUS=$code; fi
              if [[ " $WEEKLY_MARKETS " == *" $m "* ]]; then
                case "$m" in pl) CUR=PLN;; cz) CUR=CZK;; *) CUR=EUR;; esac
                python -m storewatch weekly --market "$m" --currency "$CUR" --context data/context.json \
                  --md "data/reports/$m/weekly-latest.md" --html "data/reports/$m/weekly-latest.html" > /dev/null || true
                if [ "$(date -u +%u)" = "1" ] && [ -f "data/reports/$m/weekly-latest.html" ]; then
                  WEEK=$(date -u +%G-W%V)
                  cp "data/reports/$m/weekly-latest.md" "data/reports/$m/weekly-$WEEK.md"
                  cp "data/reports/$m/weekly-latest.html" "data/reports/$m/weekly-$WEEK.html"
                fi
              fi
            done
            python -m storewatch usage --file data/usage.csv --budget "$BUDGET_MINUTES" --md data/reports/usage.md > /dev/null || true
            echo "status $STATUS"
          } >> "$LOG" 2>&1
          echo "coffee run finished: markets=$(ls markets/*.txt | wc -l) status=$STATUS (details in the private repository, logs/)"
          exit $STATUS

      - name: Save to private repository
        if: always() && steps.db.outputs.ok == 'true'
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -e
          git config --global user.name "storewatch-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd app/data
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Reports $(date -u +%FT%H:%MZ) (public runner)"
            for i in 1 2 3; do git push -q origin HEAD:data && break; git pull -q --rebase origin data; done
          fi
          cd ..
          if [ -f storewatch.db ]; then
            mkdir -p /tmp/dbb && gzip -c storewatch.db > /tmp/dbb/storewatch.db.gz
            cd /tmp/dbb && git init -q -b db && git add storewatch.db.gz && git commit -q -m "db $(date -u +%F)"
            git push -q -f "https://x-access-token:${DATA_TOKEN}@github.com/${PRIVATE_REPO}.git" db > /dev/null 2>&1
          fi
          echo "saved"

name: Niche recall (toys, Safety Gate)

# Test niche: toy / children's shops, checked against EU Safety Gate alerts by barcode.
# Copy of niche.yml with suffix _R, plus one "Recall check" step. Does not touch other niches.
#
# Secrets (Settings → Secrets and variables → Actions):
#   STORES_R         store list, one per line: "address | name"  (never stored in this repo)
#   NICHE_R          market code, e.g. pl-equip
#   (data goes to <owner>/storewatch-data; another repo: Actions variable DATA_REPO)
#   DATA_TOKEN       fine-grained token: Contents read/write on DATA_REPO only
#
# This repository is public, so its logs are public. run.sh keeps every address,
# product and price out of the log; everything goes to the private DATA_REPO.
on:
  schedule:
    - cron: "23 9 * * *"     # 09:23 UTC daily (coffee 05:41, chocolate 07:17)
    # Backups: GitHub may delay or drop scheduled runs; run.sh exits at once
    # if this niche was already collected today.
    - cron: "53 13 * * *"
    - cron: "53 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niche-engine            # all niches share one db branch: never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_REPO: ${{ vars.DATA_REPO || format('{0}/storewatch-data', github.repository_owner) }}
      STOREWATCH_DELAY: "0.5"
      STOREWATCH_MAX_PAGES: "300"
      STOREWATCH_WORKERS: "6"
    steps:
      - name: Secrets present?
        id: check
        env:
          S: ${{ secrets.STORES_R }}      # per niche
          T: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$S" ] && [ -n "$T" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secrets not set yet - nothing to do."; fi

      - name: Get engine
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Get private data
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          persist-credentials: true

      - name: Get private database
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        continue-on-error: true            # first run: branch "db" does not exist yet
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          ref: db
          path: db

      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect (output stays private)
        if: steps.check.outputs.ok == 'true'
        env:
          NICHE_STORES: ${{ secrets.STORES_R }}   # per niche
          NICHE: ${{ secrets.NICHE_R }}           # per niche
          DATA_DIR: data
          DB_DIR: db-out
        run: |
          mkdir -p db-out
          if [ -f db/storewatch.db.gz ]; then cp db/storewatch.db.gz db-out/; fi
          bash niche/run.sh

      - name: Recall check (output stays private)
        if: steps.check.outputs.ok == 'true'
        env:
          NICHE: ${{ secrets.NICHE_R }}
          DATA_DIR: data
        run: |
          NICHE=$(printf '%s' "$NICHE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          [ -f db-out/storewatch.db.gz ] || { echo "no database yet"; exit 0; }
          export STOREWATCH_DB="$RUNNER_TEMP/recall.db"
          gunzip -c db-out/storewatch.db.gz > "$STOREWATCH_DB"
          python -m storewatch export --market "$NICHE" --gtin --csv "$RUNNER_TEMP/cat.csv" > /dev/null
          mkdir -p "$DATA_DIR/reports/$NICHE"
          python niche/recall_check.py "$RUNNER_TEMP/cat.csv" "$DATA_DIR/reports/$NICHE/recall-$(date -u +%F).md"
          cp "$DATA_DIR/reports/$NICHE/recall-$(date -u +%F).md" "$DATA_DIR/reports/$NICHE/recall-latest.md"

      - name: Save to private repository
        if: always() && steps.check.outputs.ok == 'true'
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -e
          git config --global user.name "storewatch-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd data
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Niche data $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git push -q origin HEAD && break; git pull -q --rebase; done
          fi
          cd ..
          # Database: one commit on branch "db", overwritten every day (repository does not grow).
          if [ -f db-out/storewatch.db.gz ]; then
            cd db-out
            git init -q -b db
            git add storewatch.db.gz
            git commit -q -m "db $(date -u +%F)"
            git push -q -f "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" db > /dev/null 2>&1
          fi
          echo "saved"

name: Clients (price comparison samples)

# Client samples and paid comparisons. Store lists live in the PRIVATE data repo:
#   clients/<slug>/stores.txt   (add a file "stop" in the folder to pause a client)
# Needs only DATA_TOKEN (already set). Runs daily; a sample is ready within 24 hours.
#
# Secrets (Settings → Secrets and variables → Actions):
#   STORES_A         store list, one per line: "address | name"  (never stored in this repo)
#   NICHE_A          market code, e.g. pl-equip
#   (data goes to <owner>/storewatch-data; another repo: Actions variable DATA_REPO)
#   DATA_TOKEN       fine-grained token: Contents read/write on DATA_REPO only
#
# This repository is public, so its logs are public. run.sh keeps every address,
# product and price out of the log; everything goes to the private DATA_REPO.
on:
  schedule:
    - cron: "43 10 * * *"    # 10:43 UTC daily
    # Backups: GitHub may delay or drop scheduled runs; run.sh exits at once
    # if this niche was already collected today.
    - cron: "43 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niche-engine            # all niches share one db branch: never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_REPO: ${{ vars.DATA_REPO || format('{0}/storewatch-data', github.repository_owner) }}
      STOREWATCH_DELAY: "0.5"
      STOREWATCH_MAX_PAGES: "300"
      STOREWATCH_WORKERS: "6"
    steps:
      - name: Secrets present?
        id: check
        env:
          S: "clients"
          T: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -n "$S" ] && [ -n "$T" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secrets not set yet - nothing to do."; fi

      - name: Get engine
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Get private data
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          persist-credentials: true

      - name: Get private database
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        continue-on-error: true            # first run: branch "db" does not exist yet
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          ref: db
          path: db

      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect for clients (output stays private)
        if: steps.check.outputs.ok == 'true'
        env:
          DATA_DIR: data
          DB_DIR: db-out
        run: |
          mkdir -p db-out
          if [ -f db/storewatch.db.gz ]; then cp db/storewatch.db.gz db-out/; fi
          bash niche/clients.sh

      - name: Save to private repository
        if: always() && steps.check.outputs.ok == 'true'
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -e
          git config --global user.name "storewatch-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd data
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Niche data $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git push -q origin HEAD && break; git pull -q --rebase; done
          fi
          cd ..
          # Database: one commit on branch "db", overwritten every day (repository does not grow).
          if [ -f db-out/storewatch.db.gz ]; then
            cd db-out
            git init -q -b db
            git add storewatch.db.gz
            git commit -q -m "db $(date -u +%F)"
            git push -q -f "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" db > /dev/null 2>&1
          fi
          echo "saved"
